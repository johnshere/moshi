# 默识（moshi）配置示例 —— 全部键的权威定义见 docs/详设.md §3.6
# 复制到 ~/.moshi/config.yaml 后按需修改；未写的键使用下面的默认值。
# 未知键会导致启动失败（防止拼写错误被静默忽略）。

server:
  host: 127.0.0.1            # 只允许回环，非回环值直接拒绝启动
  port: 9836                 # 固定端口；被占用时启动失败，改端口后重启

storage:
  data_dir: "~/.moshi"
  archive_dir: "~/Documents/默识归档"
  backup_keep: 7
  backup_hour: 3
  query_log_keep_days: 3     # 检索日志保留天数（P2；0=永久；启动+每日按批清理）

ingest:
  harvest_cron: "0 3 * * *"
  harvest_batch: 200
  import_batch: 500
  max_fact_bytes: 2048
  quarantine_confidence: 0.25
  # field_map: { ts: timestamp, session_id: sessionId }   # 通用 JSONL 的字段名映射

hook:
  enabled: true              # 功能总开关（关掉 = 钩子一律放行，不注入、不落库）
  inject_existing: true      # 注入方向：把已有事实注入对话
  capture_reply: false       # 入库方向：把模型回复写成信号（开发机建议开，正式机谨慎）
  magpie_enabled: false      # 连接态（由页面「连接」按钮 / magpie.cmd 写）
  recall_timeout_ms: 600     # 单次召回预算（Magpie 单钩子默认 1000ms，留 400ms 给改写）
  inject_refresh_ms: 600000  # 低频注入：同一会话 10 分钟内只注一次；0 = 每轮都注
  top_k: 5
  max_inject_bytes: 4000     # 注入块上限（UTF-8 字节）
  capture_tool_output: false # 入库是否带工具输出正文

collect:
  sources: ["claude-code", "dsh"]   # 采集/导入共用的会话源；缺 ~/.dsh 的机器会自动跳过 dsh 源。也可写成 `- id/adapter/root` 实例列表
  enabled: true              # 是否启用后台块扫描
  interval_ms: 60000         # 后台扫描周期（0 = 不自动跑）
  llm_scan: true             # 阶段 2：对无块 turn 启用 LLM 归纳兜底
  llm_batch_turns: 40        # 阶段 2 每批最多多少 turn
  llm_per_session_daily: 1   # 每 session 每天最多调用几次 LLM
  llm_daily_token_budget: 100000  # 日 token 预算
  prompt_version: "v1"       # 阶段 2 提示版本（影响幂等键）

confidence:
  prior_tool_obs: 0.95
  prior_tool_inferred: 0.85
  prior_user_confirm: 0.98
  prior_llm_claim: 0.55
  prior_llm_grounded: 0.65
  prior_derived: 0.70
  validate_bump: 0.05
  validate_max: 0.99

redact:
  enabled: true              # 写入前脱敏（详设 §1.6），关掉等于把密钥存进本地库
  private_ip: false          # 内网 IP 可选脱敏，默认关

resolve:
  vector_threshold: 0.92     # 超此值建 alias（仍不合并）
  vector_queue_low: 0.60     # 进人工队列的下界
  vector_topk: 3

lifecycle:
  alpha: 0.15                # 采纳饱和增量
  beta: 0.70                 # 否决乘性惩罚
  half_life_days: 14
  procedure_half_life_days: 60
  floor: 0.60                # 独立验证下限

retrieval:
  vector_topk: 20
  bm25_topk: 20
  ppr_topk: 20
  ppr_damping: 0.85
  ppr_iters: 20
  ppr_max_nodes: 400
  rrf_k: 60
  vector_min_sim: 0.6        # 向量召回相关性地板（真模型标定：拒答负例上限 0.520、正例下限 0.692）
  entity_bonus: 0.25
  temporal_bonus: 0.20

subgraph:
  max_nodes: 64
  max_edges: 192
  neighbor_depth: 2

packing:
  token_budget: 1500
  utility_ratio: 0.70
  floor_min: 2
  max_fact_tokens: 80

read:
  cache_ttl_ms: 300000
  cache_similarity: 0.95
  p95_budget_ms: 80
  global_p95_budget_ms: 30

sidecar:
  python_path: ""            # 空 = 自动探测：MOSHI_PYTHON → sidecar/.venv → py -3 → PATH
  socket_path: "~/.moshi/sidecar.sock"
  idle_unload_min: 5
  idle_exit_min: 30
  startup_timeout_ms: 20000  # 首次拉起要 import torch 栈（实测 ~11.3s）
  encode_timeout_ms: 2000
  score_timeout_ms: 120
  max_restarts_per_hour: 3

model:
  embed_model: "bge-small-zh-v1.5"
  embed_dim: 512            # bge-small-zh-v1.5 的 hidden_size（默认值来自 EMBED_DIM）
  gat_mode: "off"            # off | shadow | on
  gat_weights: "~/.moshi/models/gat-v1.pt"
  delta_cap: 0.15
  overturn_threshold: 0.50

eval:
  golden_set: "~/.moshi/golden/golden.jsonl"
  flags: ["gat", "self_attn", "cross_attn", "vector", "bm25", "ppr"]

archive:
  export_cron: "0 4 * * *"
  dirty_threshold_facts: 3
  dirty_threshold_confidence: 0.15
  min_facts: 8
  history_keep: 5
  include_raw: false

ui:
  theme: "system"            # system | light | dark
  inspector_width: 420

log:
  level: "info"
  keep_days: 7

# MCP 直写闸门（P2-23 / 概设 §3.1.3）。
# 默认关闭：memory_annotate 只把候选事实放进队列，事实要经 harvest 六步校验才进图。
# 打开后，调用方可以要求「本批直接落库」，但只允许新事实与 co_occur / derived_from 边；
# depends_on / supersedes / mutually_exclusive 仍必须走审核（前者进隔离区，后者被 schema 拒）。
mcp:
  allow_direct_write: false
  direct_write_batch_max: 50        # 单批最多几条事实，超了整批拒绝（E_QUOTA）
  direct_write_per_minute_max: 120  # 每分钟最多几条直写事实，超了拒绝（E_QUOTA）

# 3D 布局（P2-01 / 详设 §10.4 / 决议 D16）。
# 坐标一律在后台 worker 线程算完落库，前端只渲染；力参数决定图的形状，
# 改完记得跑一次 `moshi layout --full` 让整张图重新收敛。
layout:
  enabled: true              # daemon 里按节流自动给新事实补坐标；false = 只能手动 `moshi layout`
  interval_ms: 60000         # 节流周期；没有新事实时一次 COUNT 就跳过
  tick_full: 300             # 全量重算的迭代次数
  tick_incremental: 60       # 增量（只给新事实落位）的迭代次数
  link_strength: 0.3
  link_distance: 30          # 边自然长度
  charge_strength: -30       # 负值 = 互斥
  center_strength: 0.02
  community_strength: 0.15   # 向社区质心的锚定力（community_id 为空时锚到全局质心）
  jitter_radius: 5           # 新事实相对质心的初始偏移半径（种子 = hash(fact_id)）
  extent: 100                # 归一化范围，100 即 [-100,100]³
  displacement_threshold: 15 # 增量平均位移超过它 → 转全量重算

# 插件运行日志（原 debug 段，P1 改名；Z-01C-e / 用户 m01321：不声明环境，只在这开、默认关）。
# 本质是插件运行日志（宿主内调用、注入字节、失败原因、回执号），不是产品功能：正式发版整块摘除。
# off     = 与历史一致：内存台账只记计数与枚举，不落盘；
# summary = 落 <数据目录>/hook/trace-YYYY-MM-DD.jsonl，多带证据 id/分数、分阶段耗时与
#           query/inject/reply 的 sha256 前 16 hex（仍不落正文）；
# full    = 再落 query/inject/evidence/reply 正文，落盘前必过 redact 段。
hook_plugin_trace:
  level: "off"               # off | summary | full
  max_bytes: 16777216        # 单文件上限，超过按 trace-<日期>.<n>.jsonl 切下一个
  keep_days: 14              # 按文件名日期清理超过天数的文件

