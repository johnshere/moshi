<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#06090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eaf0ef" media="(prefers-color-scheme: light)" />
    <title>默识 · 记忆图谱</title>
    <style>
      /* 首屏底色跟着主题走；真正的令牌在 app.css，这里只给一个不会闪的值 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #06090b;
        color: #dce8ea;
        font: 13px/1.5 'Segoe UI Variable Text', 'SF Pro Text', -apple-system, BlinkMacSystemFont,
          'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #eaf0ef;
        color: #2e4348;
      }
    </style>
    <script>
      /* 首屏渲染前定主题，避免先暗后亮；key 与 src/ui/theme.ts 一致 */
      (function () {
        try {
          var saved = window.localStorage.getItem('moshi-theme');
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.setAttribute('data-theme-mode', mode);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* 拿不到偏好就沿用暗色 */
        }
      })();
    </script>
    <!-- 下面这行整句是 static.ts 的替换锚点，改它要同步改 src/app/http/static.ts -->
    <script>
      window.__MOSHI_TOKEN__ = window.__MOSHI_TOKEN__ || '';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
