# 默识（moshi）配置示例 —— 全部键的权威定义见 docs/详设-默识记忆系统.md §3.6
# 复制到 ~/.moshi/config.toml 后按需修改；未写的键使用下面的默认值。
# 未知键会导致启动失败（防止拼写错误被静默忽略）。

[server]
host = "127.0.0.1"          # 只允许回环，非回环值直接拒绝启动
port = 53000                # 起始端口
port_scan_max = 53020       # 探测上界

[storage]
data_dir = "~/.moshi"
archive_dir = "~/Documents/默识归档"
backup_keep = 7
backup_hour = 3

[ingest]
sources = ["claude-code"]   # 适配器名
harvest_cron = "0 3 * * *"
harvest_batch = 200
import_batch = 500
max_fact_bytes = 2048
quarantine_confidence = 0.25

[confidence]
prior_tool_obs = 0.95
prior_tool_inferred = 0.85
prior_user_confirm = 0.98
prior_llm_claim = 0.55
prior_llm_grounded = 0.65
prior_derived = 0.70
validate_bump = 0.05
validate_max = 0.99

[resolve]
vector_threshold = 0.92     # 超此值建 alias（仍不合并）
vector_queue_low = 0.60     # 进人工队列的下界
vector_topk = 3

[lifecycle]
alpha = 0.15                # 采纳饱和增量
beta = 0.70                 # 否决乘性惩罚
half_life_days = 14
procedure_half_life_days = 60
floor = 0.60                # 独立验证下限

[retrieval]
vector_topk = 20
bm25_topk = 20
ppr_topk = 20
ppr_damping = 0.85
ppr_iters = 20
ppr_max_nodes = 400
rrf_k = 60
entity_bonus = 0.25
temporal_bonus = 0.20

[subgraph]
max_nodes = 64
max_edges = 192
neighbor_depth = 2

[packing]
token_budget = 1500
utility_ratio = 0.70
floor_min = 2
max_fact_tokens = 80

[read]
cache_ttl_ms = 300000
cache_similarity = 0.95
p95_budget_ms = 80
global_p95_budget_ms = 30

[sidecar]
python_path = "~/.moshi/python/bin/python"
socket_path = "~/.moshi/sidecar.sock"
idle_unload_min = 5
idle_exit_min = 30
startup_timeout_ms = 5000
encode_timeout_ms = 2000
score_timeout_ms = 120
max_restarts_per_hour = 3

[model]
embed_model = "bge-small-zh-v1.5"
embed_dim = 384
gat_mode = "off"            # off | shadow | on
gat_weights = "~/.moshi/models/gat-v1.pt"
delta_cap = 0.15
overturn_threshold = 0.50

[eval]
golden_set = "~/.moshi/golden/golden.jsonl"
flags = ["gat", "self_attn", "cross_attn", "vector", "bm25", "ppr"]

[archive]
export_cron = "0 4 * * *"
dirty_threshold_facts = 3
dirty_threshold_confidence = 0.15
min_facts = 8
history_keep = 5
include_raw = false

[ui]
theme = "system"            # system | light | dark
inspector_width = 420

[log]
level = "info"
keep_days = 7
